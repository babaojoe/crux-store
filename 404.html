<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off route | Crux Outdoor Co.</title>
  <style>
    /* Inline on purpose: a 404 can be served from any path, so relative asset links are unsafe. */
    body { margin: 0; font-family: "Nunito Sans", "Segoe UI", system-ui, sans-serif; background: #f6eddc; color: #2b3440; min-height: 100vh; display: grid; place-items: center; text-align: center; }
    h1 { font-family: "Bree Serif", Georgia, serif; color: #1f2f55; }
    a { color: #2f8fd6; }
  </style>
</head>
<body>
  <main>
    <h1>Looks like you are off route</h1>
    <p>That page does not exist. <a id="home" href="/">Head back to base camp</a>.</p>
  </main>
  <script>
    // On GitHub project pages the site lives under /<repo>/, elsewhere at the root.
    var parts = location.pathname.split('/').filter(Boolean);
    document.getElementById('home').href = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
  </script>
</body>
</html>
