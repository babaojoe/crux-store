<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crux Outdoor Co.</title>
  <meta name="description" content="Climbing gear for every route, with Beta, our voice guide, on the line. A fictional demo store.">
  <link rel="icon" href="assets/brand/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="announce">Free standard shipping for members*. Basecamp is free to join. <a href="#/support">Details</a></div>
  <header class="site-header" id="site-header"></header>
  <main id="app" tabindex="-1" aria-live="polite"><div class="wrap" style="padding-top:40px">Loading…</div></main>
  <footer class="site-footer" id="site-footer"></footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Cart" aria-hidden="true">
    <header><h2>Your cart</h2><button class="icon-btn" id="drawer-close">Close</button></header>
    <div class="body" id="drawer-body"></div>
    <footer id="drawer-foot"></footer>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="beta-hint" id="hint"><span><b>Questions?</b> Tap the call button to talk to Beta.</span><button id="hint-close" aria-label="Dismiss">×</button></div>

  <script src="js/config.js"></script>
  <script src="js/beta-widget.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
